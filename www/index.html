<script>

const APP_SYS_PRM="Ты можешь создавать сам файлы на телефоне пользователя, пиши [create:НазваниеФайла] если хочешь создать файл. пиши [folder:Название] чтобы создать папку. чтобы сменить название папке/файлу пиши [rename:НовоеНазваниеФайла:СтароеНазваниеФайла]. Чтобы получить исходный текст/код в файле пиши [open:НазваниеФайла]. всегда когда пишешь код, пиши сначало название файла куда его поместишь, а затем сам код, который туда попадет. Никогда не пиши команды по типу создание/удаления просто так. чтобы удалить файл пиши [delete:(названиеФайла)]. [info] - если ты напишешь эту команду, то получишь информацию о телефоне пользователя.";
const RSN_PRM="пиши мысли в слух, пиши свои мысли прямо в начале сообщения, Но перед мыслями ВСЕГДА ставь 3 плюсика. а когда закончишь пиши комбинацию из трех плюсов и на новой строчке отвечай пользователю.";
let usrSysPrm="Ты Zimo, упоминай это тогда когда нужно, ты сделан компанией которая тебя и сделала. Общайся с пользователем.";
let isLoc=true;let isRsn=false;let clpsdBlks=new Set();
const phrs=["Приступим?","какие планы?","Твой ход!","давайте начнем"];
let chtData=[];let curChtId=null;let isBusy=false;let ctrl=null;
const defModls=[];
let cstModls=[];let actvModl=null; 
function saveSt(){localStorage.setItem('zc_chts',JSON.stringify(chtData));localStorage.setItem('zc_id',curChtId);localStorage.setItem('zc_mod',JSON.stringify(actvModl));localStorage.setItem('zc_prm',usrSysPrm);localStorage.setItem('zc_cmod',JSON.stringify(cstModls));localStorage.setItem('zc_loc',isLoc);localStorage.setItem('zc_rsn',isRsn);}
function loadSt(){const sC=localStorage.getItem('zc_chts');const sI=localStorage.getItem('zc_id');const sM=localStorage.getItem('zc_mod');const sP=localStorage.getItem('zc_prm');const sCM=localStorage.getItem('zc_cmod');const sL=localStorage.getItem('zc_loc');const sR=localStorage.getItem('zc_rsn');if(sC)chtData=JSON.parse(sC);if(sCM)cstModls=JSON.parse(sCM);if(sM){actvModl=JSON.parse(sM);if(!actvModl.name)actvModl.name=actvModl.apiName;}else{actvModl=null;}if(sL!==null)isLoc=sL==='true';if(sR!==null)isRsn=sR==='true';updOptUI();if(sP){usrSysPrm=sP;document.getElementById('sysPrm').value=sP;}else{document.getElementById('sysPrm').value=usrSysPrm;}document.getElementById('sysPrm').addEventListener('input',(e)=>{usrSysPrm=e.target.value;localStorage.setItem('zc_prm',usrSysPrm);});if(chtData.length===0){crtNewCht(false);}else{curChtId=sI?parseInt(sI):chtData[0].id;}rndrChtLst();rndrMsgs();rndrModDrp();updNewCht();}
function updOptUI(){document.getElementById('optLoc').classList.toggle('active',isLoc);document.getElementById('optRsn').classList.toggle('active',isRsn);}
function getActvCht(){return chtData.find(c=>c.id===curChtId);}
function clnEmpty(){const a=getActvCht();if(a&&a.messages.length===0){chtData=chtData.filter(c=>c.id!==a.id);}}
function updNewCht(){const c=getActvCht();const b=document.getElementById('newChtBtn');if(c&&c.messages.length===0){b.classList.add('active-pill');}else{b.classList.remove('active-pill');}}
function crtNewCht(u=true){clnEmpty();curChtId=Date.now();chtData.push({id:curChtId,title:"Новый чат",messages:[]});clpsdBlks.clear();saveSt();if(u){rndrChtLst();rndrMsgs();tglMenu(false);}updNewCht();}
function newCht(){if(isBusy)return;crtNewCht(true);}
function swtchCht(id){if(isBusy)return;if(curChtId===id)return;clnEmpty();curChtId=id;clpsdBlks.clear();saveSt();rndrChtLst();rndrMsgs();tglMenu(false);updNewCht();}
function delCht(id,e){if(e)e.stopPropagation();shwCnfrm(()=>{chtData=chtData.filter(c=>c.id!==id);if(curChtId===id){if(chtData.length>0){curChtId=chtData[0].id;}else{crtNewCht(false);}}saveSt();rndrChtLst();rndrMsgs();updNewCht();});}
function rndrChtLst(){const l=document.getElementById('chtHistLst');l.innerHTML='';[...chtData].reverse().forEach(c=>{const b=document.createElement('div');b.className='chtItm';if(c.id===curChtId)b.classList.add('active-cht');let h=`<span class="chtTtl">${c.title}</span>`;if(c.id===curChtId){h+=`<button class="delCht" onclick="delCht(${c.id},event)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>`;}b.innerHTML=h;b.onclick=()=>swtchCht(c.id);l.appendChild(b);});}
function rndrMsgs(){const c=getActvCht();const cb=document.getElementById('chatBox');cb.innerHTML='';if(!c||c.messages.length===0){cb.innerHTML=`<div id="wlcScr"><img src="icon.png" alt="Zimo"><p id="wlcTxt">${phrs[Math.floor(Math.random()*phrs.length)]}</p></div>`;document.body.classList.remove('chat-active');return;}document.body.classList.add('chat-active');c.messages.forEach((m,i)=>{if(m.role==='user'){const u=document.createElement('div');u.className='msg usr';u.innerText=m.content;cb.appendChild(u);}else{const w=document.createElement('div');w.className='aiWrp';const a=document.createElement('div');a.className='msg aiMsg';let mh="";const tc=m.content.trimStart();if(tc.startsWith("+++")){const sp=tc.indexOf("+++",3);if(sp!==-1){const rt=tc.substring(3,sp).trim();const dc=tc.substring(sp+3).trim();mh+=`<div class="rsnBlk" onclick="this.classList.toggle('open')"><div class="rsnHd"><svg class="rsnArr" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>Размышлял</div><div class="rsnTxt">${rt}</div></div>`;mh+=rndrMd(dc,false);}else{mh+=rndrMd(m.content,false);}}else{mh+=rndrMd(m.content,false);}a.innerHTML=mh;w.appendChild(a);const act=document.createElement('div');act.className='aiAct';act.innerHTML=`<button onclick="cpTxt(this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>`;if(i===c.messages.length-1){act.innerHTML+=`<button class="rtryBtn" onclick="rtryMsg(this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg></button>`;}w.appendChild(act);cb.appendChild(w);}});cb.scrollTop=cb.scrollHeight;}
function shwTst(m){const t=document.getElementById("tst");t.innerText=m;t.classList.add("show");setTimeout(()=>{t.classList.remove("show");},3000);}
let cnfrmCb=null;function shwCnfrm(cb){cnfrmCb=cb;document.getElementById('cnfOvr').classList.add('active');}
function hdCnfrm(){document.getElementById('cnfOvr').classList.remove('active');cnfrmCb=null;}
document.getElementById('yesBtn').onclick=()=>{if(cnfrmCb)cnfrmCb();hdCnfrm();};
function tglSet(s){document.getElementById('setPnl').classList.toggle('active',s);}
function tglOptDrp(){document.getElementById('optDrp').classList.toggle('open');}
function tglLoc(){isLoc=!isLoc;updOptUI();saveSt();}
function tglRsn(){isRsn=!isRsn;updOptUI();saveSt();}
let selPrvUrl='https://generativelanguage.googleapis.com/v1beta/openai/chat/completions';
function opnAddMod(){document.getElementById('modDrp').classList.remove('open');document.getElementById('addModOvr').classList.add('active');}

function svNewMod(){const n=document.getElementById('newModId').value.trim();const k=document.getElementById('newApiKey').value.trim();const rx=/[а-яА-ЯёЁ]/;if(rx.test(n)||rx.test(k)){shwTst("Ошибка: русские буквы запрещены");return;}if(!n||!k){shwTst("Заполните все поля");return;}cstModls.push({name:n,apiName:n,url:selPrvUrl,key:k});saveSt();document.getElementById('newModId').value='';document.getElementById('newApiKey').value='';rndrModDrp();clsAddMod();shwTst("Модель добавлена!");}
function rndrModDrp(){const lc=document.getElementById('modLst');lc.innerHTML='';[...defModls,...cstModls].forEach(m=>{const i=document.createElement('div');i.className='modItm';if(actvModl&&actvModl.apiName===m.apiName&&actvModl.url===m.url)i.classList.add('active');i.innerHTML=`<span>${m.name}</span><svg class="chkIcn" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;i.onclick=()=>selMod(m.name,m.apiName,m.url,m.key,i);lc.appendChild(i);});const cn=actvModl?(actvModl.name||actvModl.apiName||''):'Модель';document.getElementById('curModNm').innerText=cn.length>6?cn.substring(0,6)+'...':cn;}
function selMod(n,a,u,k,e){actvModl={name:n,apiName:a,url:u,key:k};saveSt();rndrModDrp();document.getElementById('modDrp').classList.remove('open');}
function hdlInpt(){const t=document.getElementById('txtInpt');const tx=t.value;const ib=document.getElementById('icnBars');const ia=document.getElementById('icnArr');const is=document.getElementById('icnStp');const w=document.getElementById('wlcScr');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,100)+'px';if(isBusy){ib.style.display='none';ia.style.display='none';is.style.display='block';return;}if(tx.trim().length>0){ib.style.display='none';ia.style.display='block';is.style.display='none';if(w)w.classList.add('hidden');}else{ib.style.display='block';ia.style.display='none';is.style.display='none';if(w&&getActvCht().messages.length===0)w.classList.remove('hidden');}}

function stpGen(){if(ctrl)ctrl.abort();}
async function execAct(a,args){console.log(`Act: ${a} ${args}`);if(window.Capacitor&&Filesystem){try{if(a==='create'){await Filesystem.writeFile({path:args,data:'',directory:Directory.Documents,encoding:Encoding.UTF8,recursive:true});shwTst(`Файл: ${args}`);}else if(a==='folder'){await Filesystem.mkdir({path:args,directory:Directory.Documents,recursive:true});shwTst(`Папка: ${args}`);}else if(a==='delete'){await Filesystem.rmdir({path:args,directory:Directory.Documents,recursive:true});shwTst(`Удалено: ${args}`);}}catch(e){shwTst(`Err: ${e.message}`);}}else{shwTst(`Mock: ${a} ${args}`);}}
function prcsAgAct(tx){const rx=/\[(create|folder|rename|open|delete):?([^\]]*)\]/g;let m;while((m=rx.exec(tx))!==null){execAct(m[1],m[2]||"");}}
function tglBlk(h){const b=h.closest('.codeBlk');const c=b.querySelector('code');if(!c)return;const ct=c.innerText;if(b.classList.contains('collapsed')){b.classList.remove('collapsed');clpsdBlks.delete(ct);}else{b.classList.add('collapsed');clpsdBlks.add(ct);}}
function opnHtmlPrv(b){const c=b.closest('.codeBlk').querySelector('code').innerText;const f=document.getElementById('prvIfrm');const bl=new Blob([c],{type:'text/html'});f.src=URL.createObjectURL(bl);document.getElementById('prvPnl').classList.add('active');}
function clsHtmlPrv(){const f=document.getElementById('prvIfrm');if(f.src.startsWith('blob:'))URL.revokeObjectURL(f.src);f.src='about:blank';document.getElementById('prvPnl').classList.remove('active');}
function rndrMd(tx,isS=false){const cb=[];const ab=[];tx=tx.replace(/\[cd:[^\]]+\]/g,'');tx=tx.replace(/\[info\]/g,'');const arx=/\[(create|folder|rename|open|delete):?([^\]]*)\]/g;tx=tx.replace(arx,(m,a,args)=>{let at="",in="file",da=args;if(a==='create')at="create file";else if(a==='folder'){at="create folder";in="folder";}else if(a==='rename'){at="rename file";const p=args.split(':');if(p.length===2)da=`${p[1]} -> ${p[0]}`;}else if(a==='open')at="open file";else if(a==='delete'){at="delete file";in="trash";}const fi=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`;const fo=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`;const ti=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;let ih=fi;if(in==='folder')ih=fo;if(in==='trash')ih=ti;const ah=`<svg class="tgArr" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;const ic=isS?clpsdBlks.has(da):true;const bc=ic?'collapsed':'';const bh=`<div class="codeBlk ${bc}"><div class="codeHd" onclick="tglBlk(this)"><span class="langTxt">${at}</span><div class="actBtns">${ih}${ah}</div></div><div class="codeWrap"><div class="codeBd"><code>${da}</code></div></div></div>`;ab.push(bh);return`%%ACTBLK_${ab.length-1}%%`;});let dt=tx;if(isS){const oc=(tx.match(/```/g)||[]).length;if(oc%2!==0){const li=tx.lastIndexOf('```');dt=tx.substring(0,li);}}const crx=/```([\w-]*)\n?([\s\S]*?)```/g;dt=dt.replace(crx,(m,l,c)=>{const vl=l||'txt';const ec=c.replace(/</g,'&lt;').replace(/>/g,'&gt;').trim();const ah=`<svg class="tgArr" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;const pb=vl.toLowerCase()==='html'?`<button onclick="opnHtmlPrv(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></button>`:'';const ic=isS?clpsdBlks.has(ec):true;const bc=ic?'collapsed':'';const bh=`<div class="codeBlk ${bc}"><div class="codeHd" onclick="tglBlk(this)"><span class="langTxt">${vl}</span><div class="actBtns"><button onclick="cpCode(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button><button onclick="dlCode(this,'${vl}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></button>${pb}${ah}</div></div><div class="codeWrap"><div class="codeBd"><code>${ec}</code></div></div></div>`;cb.push(bh);return`%%CODEBLK_${cb.length-1}%%`;});let st=dt.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
