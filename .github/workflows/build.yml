name: Build Zimo Code APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem
        npm install -D @capacitor/assets

    - name: Prepare Config and Icon
      run: |
        echo '{"appId":"com.zimocode.app","appName":"Zimo Code","webDir":"www"}' > capacitor.config.json
        mkdir -p resources
        cp www/icon.png resources/icon.png

    - name: Generate Android Icons
      run: npx capacitor-assets generate --android

    - name: Add Android Platform
      run: npx cap add android

    - name: Add File Permissions
      run: |
        sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"\/>\n<\/manifest>/' android/app/src/main/AndroidManifest.xml

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: zimo-code-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
