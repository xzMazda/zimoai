name: Build Zimo Code APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Capacitor
      run: |
        rm -f package.json package-lock.json
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/app --legacy-peer-deps

    - name: Prepare Config
      run: echo '{"appId":"com.zimocode.app","appName":"Zimo Code","webDir":"www"}' > capacitor.config.json

    - name: Add Android Platform
      run: npx cap add android

    - name: Force Custom Icon
      run: |
        rm -rf android/app/src/main/res/mipmap-anydpi-v26
        for dir in android/app/src/main/res/mipmap-*; do
          cp www/icon.png "$dir/ic_launcher.png"
          cp www/icon.png "$dir/ic_launcher_round.png"
        done

    - name: Add File Permissions
      run: |
        sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"\/>\n<\/manifest>/' android/app/src/main/AndroidManifest.xml

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: zimo-code-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
